[build-system]
requires = [ "poetry-core>=1.2.0" ]
build-backend = "poetry.core.masonry.api"
# poetry-core 1.8 not available in .fc39. Can upgrade to 1.8.0 at .fc39 EOL

[tool.poetry-version-plugin]
source = "init"

[tool.poetry]
name = "no-shit-sherlock"
version = "1.0.0"
description = "High-end, ethical, and stealthy OSINT suite for deep intelligence gathering"
license = "MIT"
authors = [
    "No shit Sherlock"
]
maintainers = [
    "No shit Sherlock"
]
readme = "docs/pyproject/README.md"
packages = [ { include = "sherlock_project"} ]
keywords = [ "osint", "reconnaissance", "information gathering", "stealth", "dox", "ethical" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security"
]
homepage = "https://github.com/m9x8/no-shit-sherlok"
repository = "https://github.com/m9x8/no-shit-sherlok"


[tool.poetry.urls]
"Bug Tracker" = "https://github.com/m9x8/no-shit-sherlok/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
certifi = ">=2019.6.16"
colorama = "^0.4.1"
PySocks = "^1.7.0"
requests = "^2.22.0"
requests-futures = "^1.0.0"
stem = "^1.8.0"
pandas = "^2.2.1"
openpyxl = "^3.0.10"
tomli = "^2.2.1"
phonenumbers = "^9.0.36"
python-docx = "^1.2.0"
customtkinter = "^6.0.0"
reportlab = "^4.0.0"
curl-cffi = "^0.16.0"
mmh3 = "^5.2.1"
dnspython = "^2.8.0"
networkx = "*"
pyvis = "^0.3.2"
levenshtein = "^0.27.4"
bs4 = "^0.0.2"
python-whois = "^0.9.6"
shodan = "^1.31.0"
cryptography = "^50.0.0"
geopy = "^2.5.0"
maigret = {git = "https://github.com/m9x8/maigreta.git"}
nodriver = "^0.50.3"
camoufox = {extras = ["geoip"], version = "*"}
holehe = "*"

[tool.poetry.group.dev.dependencies]
jsonschema = "^4.0.0"
rstr = "^3.2.2"
pytest = "^8.4.2"
pytest-xdist = "^3.8.0"
pyinstaller = {markers = "python_version < \"3.13\"", version = "^6.22.0"}
pytest-asyncio = "^1.4.0"


[tool.poetry.group.ci.dependencies]
defusedxml = "^0.7.1"

[tool.poetry.scripts]
sherlock = 'sherlock_project.sherlock:main'
